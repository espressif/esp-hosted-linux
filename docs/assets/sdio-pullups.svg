<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-labelledby="title desc">
  <title id="title">ESP-Hosted-Linux SDIO wiring and required pull-ups</title>
  <desc id="desc">Linux host connects CLK, CMD, DAT0 through DAT3, and ground to an ESP device. Reset or enable can be connected when the platform needs MMC power sequencing before enumeration. A separate pull-up schematic shows CMD and DAT0 through DAT3 each connected to 3.3 volts through a 10 kilo-ohm resistor. ESP-side SDIO pin numbers are shown for ESP32, ESP32-C5, ESP32-C6, and ESP32-C61.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
    <style>
      .host{fill:#f7f8fa;stroke:#4b5563;stroke-width:2}
      .esp{fill:#fffafa;stroke:#e7352c;stroke-width:2}
      .inset{fill:#fffafa;stroke:#e7352c;stroke-width:1.5}
      .title{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827;text-anchor:middle}
      .sub{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6b7280;text-anchor:middle}
      .signal{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827;text-anchor:middle}
      .pinHead{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#c92f27;text-anchor:middle}
      .pin{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#111827;text-anchor:middle}
      .note{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4b5563;text-anchor:middle}
      .wire{stroke:#4b5563;stroke-width:2.2;fill:none}
      .bidir{stroke:#4b5563;stroke-width:2.2;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
      .toesp{stroke:#4b5563;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .reset{stroke:#e7352c;stroke-width:2.3;fill:none;marker-end:url(#arrow)}
      .pull{stroke:#e7352c;stroke-width:2;fill:#fff}
      .vdd{stroke:#e7352c;stroke-width:2.5;fill:none}
      .vddText{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#c92f27;text-anchor:middle}
      .resText{font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#c92f27;text-anchor:middle}
      .netText{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#111827;text-anchor:middle}
      .divider{stroke:#f0b8b5;stroke-width:1}
      .labelBg{fill:#fff;opacity:.94}
    </style>
  </defs>

  <rect class="host" x="35" y="55" width="205" height="510" rx="14" ry="14"/>
  <text class="title" x="137" y="92">Linux host</text>
  <text class="sub" x="137" y="116">SDIO / MMC controller</text>

  <rect class="esp" x="840" y="55" width="405" height="510" rx="14" ry="14"/>
  <text class="title" x="1042" y="92">ESP device</text>
  <text class="sub" x="1042" y="116">ESP-side SDIO pins</text>
  <text class="pinHead" x="900" y="148">ESP32</text>
  <text class="pinHead" x="990" y="148">C5</text>
  <text class="pinHead" x="1080" y="148">C6</text>
  <text class="pinHead" x="1170" y="148">C61</text>
  <line class="divider" x1="865" y1="158" x2="1215" y2="158"/>

  <!-- Main SDIO bus -->
  <path class="toesp" d="M240 175 H840"/>
  <rect class="labelBg" x="480" y="160" width="80" height="22" rx="4"/><text class="signal" x="520" y="176">CLK</text>
  <text class="pin" x="900" y="179">IO14</text><text class="pin" x="990" y="179">IO9</text><text class="pin" x="1080" y="179">IO19</text><text class="pin" x="1170" y="179">IO26</text>

  <path class="bidir" d="M240 230 H840"/>
  <rect class="labelBg" x="480" y="215" width="80" height="22" rx="4"/><text class="signal" x="520" y="231">CMD</text>
  <text class="pin" x="900" y="234">IO15</text><text class="pin" x="990" y="234">IO10</text><text class="pin" x="1080" y="234">IO18</text><text class="pin" x="1170" y="234">IO25</text>

  <path class="bidir" d="M240 285 H840"/>
  <rect class="labelBg" x="480" y="270" width="80" height="22" rx="4"/><text class="signal" x="520" y="286">DAT0</text>
  <text class="pin" x="900" y="289">IO2</text><text class="pin" x="990" y="289">IO8</text><text class="pin" x="1080" y="289">IO20</text><text class="pin" x="1170" y="289">IO27</text>

  <path class="bidir" d="M240 340 H840"/>
  <rect class="labelBg" x="480" y="325" width="80" height="22" rx="4"/><text class="signal" x="520" y="341">DAT1</text>
  <text class="pin" x="900" y="344">IO4</text><text class="pin" x="990" y="344">IO7</text><text class="pin" x="1080" y="344">IO21</text><text class="pin" x="1170" y="344">IO28</text>

  <path class="bidir" d="M240 395 H840"/>
  <rect class="labelBg" x="480" y="380" width="80" height="22" rx="4"/><text class="signal" x="520" y="396">DAT2</text>
  <text class="pin" x="900" y="399">IO12</text><text class="pin" x="990" y="399">IO14</text><text class="pin" x="1080" y="399">IO22</text><text class="pin" x="1170" y="399">IO22</text>

  <path class="bidir" d="M240 450 H840"/>
  <rect class="labelBg" x="480" y="435" width="80" height="22" rx="4"/><text class="signal" x="520" y="451">DAT3</text>
  <text class="pin" x="900" y="454">IO13</text><text class="pin" x="990" y="454">IO13</text><text class="pin" x="1080" y="454">IO23</text><text class="pin" x="1170" y="454">IO23</text>

  <path class="reset" d="M240 505 H840"/>
  <rect class="labelBg" x="385" y="490" width="270" height="22" rx="4"/><text class="signal" x="520" y="506">Reset / Enable (optional pwrseq)</text>
  <text class="pin" x="900" y="509">EN</text><text class="pin" x="990" y="509">RST</text><text class="pin" x="1080" y="509">RST</text><text class="pin" x="1170" y="509">RST</text>

  <path class="wire" d="M240 545 H840"/>
  <rect class="labelBg" x="480" y="530" width="80" height="22" rx="4"/><text class="signal" x="520" y="546">Ground</text>

  <!-- Unambiguous pull-up schematic: same named nets as the bus above. -->
  <rect class="inset" x="300" y="590" width="680" height="108" rx="12" ry="12"/>
  <text class="sub" x="640" y="614">Required SDIO pull-ups — same nets as above</text>
  <line class="vdd" x1="440" y1="620" x2="900" y2="620"/>
  <text class="vddText" x="420" y="625">3.3 V</text>

  <g><line class="pull" x1="500" y1="620" x2="500" y2="635"/><rect class="pull" x="493" y="635" width="14" height="26" rx="2"/><line class="pull" x1="500" y1="661" x2="500" y2="675"/><text class="resText" x="500" y="650">10 kΩ</text><text class="netText" x="500" y="691">CMD</text></g>
  <g><line class="pull" x1="590" y1="620" x2="590" y2="635"/><rect class="pull" x="583" y="635" width="14" height="26" rx="2"/><line class="pull" x1="590" y1="661" x2="590" y2="675"/><text class="resText" x="590" y="650">10 kΩ</text><text class="netText" x="590" y="691">DAT0</text></g>
  <g><line class="pull" x1="680" y1="620" x2="680" y2="635"/><rect class="pull" x="673" y="635" width="14" height="26" rx="2"/><line class="pull" x1="680" y1="661" x2="680" y2="675"/><text class="resText" x="680" y="650">10 kΩ</text><text class="netText" x="680" y="691">DAT1</text></g>
  <g><line class="pull" x1="770" y1="620" x2="770" y2="635"/><rect class="pull" x="763" y="635" width="14" height="26" rx="2"/><line class="pull" x1="770" y1="661" x2="770" y2="675"/><text class="resText" x="770" y="650">10 kΩ</text><text class="netText" x="770" y="691">DAT2</text></g>
  <g><line class="pull" x1="860" y1="620" x2="860" y2="635"/><rect class="pull" x="853" y="635" width="14" height="26" rx="2"/><line class="pull" x1="860" y1="661" x2="860" y2="675"/><text class="resText" x="860" y="650">10 kΩ</text><text class="netText" x="860" y="691">DAT3</text></g>

  <text class="note" x="640" y="724">CMD/DAT pull-ups are required. Reset/Enable is only needed when the host platform uses it for pre-enumeration power sequencing.</text>
</svg>
