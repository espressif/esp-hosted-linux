<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">ESP-Hosted-Linux system architecture</title>
  <desc id="desc">Linux applications use standard networking, cfg80211 nl80211, Bluetooth HCI, and an OpenThread RCP character device. ESP-Hosted-Linux carries those paths over SDIO, SPI, or USB to ESP firmware and the Wi-Fi, Bluetooth, and IEEE 802.15.4 radios.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e7352c"/>
    </marker>
    <style>
      .box{fill:#f7f8fa;stroke:#4b5563;stroke-width:2;rx:12;ry:12}
      .group{fill:#ffffff;stroke:#9ca3af;stroke-width:2;stroke-dasharray:7 5;rx:16;ry:16}
      .espGroup{fill:#fffafa;stroke:#e7352c}
      .hosted{fill:#fff4f3;stroke:#e7352c}
      .label{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827;text-anchor:middle}
      .small{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#374151;text-anchor:middle}
      .groupLabel{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}
      .espTitle{fill:#c92f27}
      .bi{stroke:#555;stroke-width:2.2;fill:none;marker-end:url(#arrow);marker-start:url(#arrow)}
      .transport{stroke:#e7352c;stroke-width:2.8;fill:none;marker-end:url(#arrowRed);marker-start:url(#arrowRed)}
    </style>
  </defs>

  <rect class="group" x="25" y="25" width="650" height="510"/>
  <text class="groupLabel" x="50" y="60">Linux host</text>

  <rect class="box" x="120" y="85" width="460" height="80"/>
  <text class="label" x="350" y="118">User space</text>
  <text class="small" x="350" y="143">applications · wpa_supplicant · hostapd · iw · BlueZ · ot-daemon</text>

  <rect class="box" x="100" y="205" width="500" height="90"/>
  <text class="label" x="350" y="238">Linux networking, Bluetooth, and RCP interfaces</text>
  <text class="small" x="350" y="265">network stack · cfg80211 / nl80211 · HCI · /dev/esp_rcp0</text>

  <rect class="box hosted" x="120" y="335" width="460" height="85"/>
  <text class="label" x="350" y="368">ESP-Hosted-Linux host driver</text>
  <text class="small" x="350" y="394">WLAN netdev · Wi-Fi control · hosted HCI · Thread RCP stream</text>

  <rect class="box" x="210" y="455" width="280" height="60"/>
  <text class="label" x="350" y="493">Host SDIO / SPI / USB</text>

  <path class="bi" d="M350 165 V205"/>
  <path class="bi" d="M350 295 V335"/>
  <path class="bi" d="M350 420 V455"/>

  <rect class="group espGroup" x="735" y="25" width="360" height="510"/>
  <text class="groupLabel espTitle" x="760" y="60">ESP device</text>

  <rect class="box" x="775" y="95" width="280" height="85"/>
  <text class="label" x="915" y="128">Wi-Fi / Bluetooth / 802.15.4</text>
  <text class="small" x="915" y="154">ESP-IDF radio · controller · OpenThread RCP</text>

  <rect class="box hosted" x="770" y="235" width="290" height="90"/>
  <text class="label" x="915" y="270">ESP-Hosted firmware</text>
  <text class="small" x="915" y="296">commands · events · WLAN / HCI / RCP forwarding</text>

  <rect class="box" x="775" y="455" width="280" height="60"/>
  <text class="label" x="915" y="493">ESP SDIO / SPI / USB</text>

  <path class="bi" d="M915 180 V235"/>
  <path class="bi" d="M915 325 V455"/>
  <path class="transport" d="M490 485 H775"/>
</svg>
