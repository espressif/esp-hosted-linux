# Merge-request governance checks enforced from the repository.
#
# GitLab project settings separately enforce:
# - protected default branch / no direct pushes
# - required Maintainer approval
# - successful pipeline before merge
# - fast-forward-only merge
# - squash disabled

.mr_governance:
  stage: validate
  image: "$LINUX_IMAGE_6_12"
  tags:
    - x86_64
  variables:
    GIT_DEPTH: "0"
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

mr:release-notes:
  extends: .mr_governance
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - host/**/*
        - esp/**/*
    - when: never
  script:
    - .gitlab/ci/scripts/check-mr-release-notes.sh

mr:vnc-lib:
  extends: .mr_governance
  script:
    - .gitlab/ci/scripts/check-mr-vnc.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - esp/esp_driver/lib/**/*
    - when: never

mr:commit-policy:
  extends: .mr_governance
  script:
    - .gitlab/ci/scripts/check-mr-commits.sh

# Parenthetical VNC SHA lives in the lib-updating commit subject.
# The VNC MR number lives in the GitLab MR description (mr:vnc-lib).
mr:wifi-lib-revision:
  extends: .mr_governance
  script:
    - .gitlab/ci/scripts/check-wifi-lib-revision.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - esp/esp_driver/lib/**/*
    - when: never
