# Validation and repository-invariant checks.

firmware_version_auto_bump:
  stage: prepare
  image: "$ESP_CI_IMAGE"
  tags:
    - build
  script:
    - .gitlab/ci/scripts/auto-bump-version.sh
  rules:
    # The bot can only safely push to a branch in this same project.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
      changes:
        - esp/esp_driver/network_adapter/**/*
        - host/include/esp_fw_version.h
    - when: never

validate_mirrored_files:
  stage: validate
  image: "$ESP_CI_IMAGE"
  tags:
    - build
  script:
    - .gitlab/ci/scripts/check-mirrored-files.sh
  rules:
    - when: always

validate_ci_scripts:
  stage: validate
  image: "$ESP_CI_IMAGE"
  tags:
    - build
  script:
    - find .gitlab/ci -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
    - python3 -m py_compile .gitlab/ci/scripts/version_header.py
  rules:
    - changes:
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

validate_precommit:
  stage: validate
  image: "$ESP_CI_IMAGE"
  tags:
    - build
  before_script:
    - python3 -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip
    - pip install pre-commit
  script:
    - .gitlab/ci/scripts/run-precommit.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
