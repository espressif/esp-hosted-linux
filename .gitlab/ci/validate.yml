validate_mirrored_files:
  stage: validate
  image: "$ESP_CI_IMAGE"
  tags:
    - build
  script:
    - .gitlab/ci/scripts/check-mirrored-files.sh
  rules:
    - when: always

validate_ci_scripts:
  stage: validate
  image: "$ESP_CI_IMAGE"
  tags:
    - build
  script:
    - find .gitlab/ci -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
    - python3 -m py_compile .gitlab/ci/scripts/version_header.py
  rules:
    - changes:
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

validate_precommit:
  stage: validate
  image: "$ESP_CI_IMAGE"
  tags:
    - build
  before_script:
    - python3 -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip
    - pip install pre-commit
  script:
    - .gitlab/ci/scripts/run-precommit.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

validate_wifi_lib_md5:
  stage: validate
  image: "$ESP_CI_IMAGE"
  tags:
    - build
  script:
    - .gitlab/ci/scripts/check-wifi-lib-md5.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - esp/esp_driver/lib/**/*
        - esp/esp_driver/network_adapter/main/esp_wifi_driver.h
        - .gitlab/ci/scripts/check-wifi-lib-md5.sh
        - .gitlab/ci/validate.yml
    - when: never

validate_docs:
  stage: validate
  image: "$ESP_CI_IMAGE"
  tags:
    - build
  before_script:
    - python3 -m venv .venv-docs
    - . .venv-docs/bin/activate
    - pip install --upgrade pip
    - pip install -r .gitlab/ci/docs-requirements.txt
  script:
    - python3 tools/check_docs.py
    - mkdocs build --strict --site-dir /tmp/esp-hosted-docs-html
  rules:
    - changes:
        - README.md
        - CONTRIBUTING.md
        - ORIGIN.md
        - docs/**/*
        - docs-theme/**/*
        - docs-html/**/*
        - mkdocs.yml
        - tools/check_docs.py
        - .gitlab/ci/docs-requirements.txt
        - .gitlab/ci/scripts/update-docs-html.sh
        - .gitlab/ci/scripts/check-docs-html.sh
        - .gitlab/ci/validate.yml
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

