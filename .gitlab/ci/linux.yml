# ESP-Hosted Linux software-only CI.
#
# All 12 kernel SDKs compile four transports when host/build inputs change.
# Dedicated espdevpool hardware is intentionally not used here.

.linux_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - changes:
        - host/**/*
        - .gitlab/ci/linux.yml
        - .gitlab/ci/linux-images.yml
        - .gitlab/ci/scripts/linux-build.sh
        - .gitlab/ci/scripts/linux-quality.sh
        - .gitlab/ci/software/audit_modules.py
        - .gitlab/ci/software/check_diagnostics.py
        - .gitlab-ci.yml

.linux_shared:
  extends:
    - .linux_rules
  stage: compile
  tags:
    - x86_64
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    GIT_SUBMODULE_STRATEGY: none
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - build-artifacts/

.linux_compile:
  extends:
    - .linux_shared
  script:
    - bash .gitlab/ci/scripts/linux-build.sh "$KERNEL_VERSION"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - build-artifacts/linux/
    reports:
      junit: build-artifacts/linux/*/module-audit-junit.xml

host:linux-4.9:
  extends: .linux_compile
  image: "$LINUX_IMAGE_4_9"
  variables:
    KERNEL_VERSION: "4.9.337"

