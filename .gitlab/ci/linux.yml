# Quality gates use a recent LTS kernel so they test the current Linux API
# without multiplying static-analysis cost across every compatibility anchor.

linux:quality:warnings:
  extends: .linux_shared
  image: "$LINUX_IMAGE_6_12"
  script:
    - .gitlab/ci/scripts/linux-quality.sh warnings 6.12.105

linux:quality:sparse:
  extends: .linux_shared
  image: "$LINUX_IMAGE_6_12"
  script:
    - .gitlab/ci/scripts/linux-quality.sh sparse 6.12.105

linux:quality:clang:
  extends: .linux_shared
  image: "$LINUX_IMAGE_6_12"
  script:
    - .gitlab/ci/scripts/linux-quality.sh clang 6.12.105
