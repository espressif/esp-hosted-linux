    KERNEL_VERSION: "5.4.302"

linux:compile:5.10:
  extends: .linux_compile
  image: "$LINUX_IMAGE_5_10"
  variables:
    KERNEL_VERSION: "5.10.266"

linux:compile:5.15:
  extends: .linux_compile
  image: "$LINUX_IMAGE_5_15"
