# ESP-Hosted Linux software-only CI.
#
# Routine compilation/static analysis runs on Espressif shared Docker runners.
# Dedicated espdevpool hardware is intentionally not used here.

.linux_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - changes:
        - host/**/*
        - .gitlab/ci/linux.yml
        - .gitlab/ci/linux-images.yml
        - .gitlab/ci/scripts/linux-build.sh
        - .gitlab/ci/scripts/linux-quality.sh
        - .gitlab/ci/docker/linux-base/**/*
        - .gitlab/ci/docker/linux-kernel/**/*
        - .gitlab/ci/kernel-sdk/**/*
        - .gitlab-ci.yml

.linux_shared:
  extends:
    - .linux_rules
  stage: build
  tags:
    - x86_64
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    GIT_SUBMODULE_STRATEGY: none
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - build-artifacts/

.linux_compile:
  extends:
    - .linux_shared
  script:
    - .gitlab/ci/scripts/linux-build.sh "$KERNEL_VERSION"

linux:compile:4.9:
  extends: .linux_compile
  image: "$LINUX_IMAGE_4_9"
  variables:
    KERNEL_VERSION: "4.9.337"

linux:compile:4.14:
  extends: .linux_compile
  image: "$LINUX_IMAGE_4_14"
  variables:
    KERNEL_VERSION: "4.14.336"

