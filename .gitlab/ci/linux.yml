# Quality gates use a recent LTS kernel so they test the current Linux API
# without multiplying static-analysis cost across every compatibility anchor.

host:warnings:
  extends: .linux_shared
  stage: test
  image: "$LINUX_IMAGE_6_12"
  script:
    - bash .gitlab/ci/scripts/linux-quality.sh warnings 6.12.105

host:sparse:
  extends: .linux_shared
  stage: test
  image: "$LINUX_IMAGE_6_12"
  script:
    - bash .gitlab/ci/scripts/linux-quality.sh sparse 6.12.105

host:clang:
  extends: .linux_shared
  stage: test
  image: "$LINUX_IMAGE_6_12"
  script:
    - bash .gitlab/ci/scripts/linux-quality.sh clang 6.12.105
